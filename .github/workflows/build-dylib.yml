name: 🔧 Build Dylib TwitchPlusK

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths: ['**.m', '**.h', '**.c', '**.x', '**.xm', 'Makefile', '.github/workflows/build-dylib.yml']

env:
  THEOS: ${{ github.workspace }}/theos
  # Leave empty to use the newest SDK theos/sdks publishes,
  # or pin one, e.g. "iPhoneOS17.5"
  PREFERRED_SDK: ""
  MIN_IOS: "14.0"

permissions:
  contents: write

jobs:
  build-dylib:
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout tweak code
        uses: actions/checkout@v6

      # Cache key rolls over monthly so Theos + SDK get refreshed automatically
      - name: 📅 Cache period
        id: period
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: 💾 Cache Theos
        id: cache-theos
        uses: actions/cache@v5
        with:
          path: ${{ env.THEOS }}
          key: theos-ios-${{ runner.os }}-${{ steps.period.outputs.month }}-${{ env.PREFERRED_SDK }}

      - name: 🔧 Install Theos + iOS SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "📦 Cloning Theos..."
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"

          echo "🔍 Looking up SDK via GitHub API..."
          cat > /tmp/find_sdk.py << 'PYEOF'
          import sys, json, re, os
          pref = os.environ.get("PREFERRED_SDK", "").strip()
          try:
              assets = json.load(sys.stdin).get("assets", [])
          except Exception as e:
              print(f"Error: {e}", file=sys.stderr); print(""); sys.exit(0)
          best = None
          for a in assets:
              name = a.get("name", "")
              m = re.fullmatch(r"iPhoneOS(\d+(?:\.\d+)*)\.sdk\.tar\.xz", name)
              if not m:
                  continue
              if pref and not name.startswith(pref + ".sdk"):
                  continue
              ver = tuple(int(x) for x in m.group(1).split("."))
              if best is None or ver > best[0]:
                  best = (ver, a["browser_download_url"])
          if best is None:
              print("No matching SDK. Available:", file=sys.stderr)
              for a in assets:
                  print(" -", a.get("name", "?"), file=sys.stderr)
          print(best[1] if best else "")
          PYEOF

          API_URL=$(curl --silent --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/theos/sdks/releases/latest" \
            | python3 /tmp/find_sdk.py)
          echo "🔗 API URL: ${API_URL:-(empty)}"

          ALL_URLS=()
          [[ "$API_URL" == https://* ]] && ALL_URLS+=("$API_URL")
          for v in 17.5 17.2 16.5; do
            ALL_URLS+=("https://github.com/theos/sdks/releases/latest/download/iPhoneOS$v.sdk.tar.xz")
          done

          SDK_FILE="/tmp/iphone_sdk.tar.xz"
          SDK_OK=false
          for URL in "${ALL_URLS[@]}"; do
            echo "⬇️  Trying: $URL"
            if curl --fail --silent --location --output "$SDK_FILE" "$URL" \
               && file --brief "$SDK_FILE" | grep -qi "XZ compressed"; then
              echo "✅ Valid SDK"; SDK_OK=true; break
            fi
            echo "⚠️  Failed"; rm -f "$SDK_FILE"
          done
          [ "$SDK_OK" = true ] || { echo "❌ Could not download a valid iOS SDK"; exit 1; }

          tar -xJf "$SDK_FILE" -C "$THEOS/sdks/"
          rm -f "$SDK_FILE"
          echo "📋 Available SDKs:"; ls "$THEOS/sdks/"

      - name: 🔑 Install ldid + GNU Make
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          set -euo pipefail
          brew install ldid make
          MAKE_BIN_DIR="$(brew --prefix make)/libexec/gnubin"
          echo "$MAKE_BIN_DIR" >> "$GITHUB_PATH"
          echo "✅ ldid: $(which ldid)"

      - name: 🔨 Compile the tweak
        run: |
          set -euo pipefail
          export PATH="$THEOS/bin:$PATH"
          echo "🔨 $(make --version | head -1)"

          SDK_NAME=$(ls "$THEOS/sdks/" | grep -E '^iPhoneOS[0-9.]+\.sdk$' | sort -V | tail -1)
          [ -n "$SDK_NAME" ] || { echo "❌ No SDK found"; exit 1; }
          SDK_VER=$(echo "$SDK_NAME" | grep -oE '[0-9]+(\.[0-9]+)*')
          echo "📱 SDK: $SDK_NAME"

          make -j"$(sysctl -n hw.ncpu)" FINALPACKAGE=1 \
            TARGET="iphone:clang:${SDK_VER}:${MIN_IOS}"

          DYLIB_PATH=$(find .theos -name "*.dylib" -path "*/obj/*" 2>/dev/null | head -1)
          [ -n "$DYLIB_PATH" ] || DYLIB_PATH=$(find . -name "*.dylib" -not -path "./theos/*" | head -1)
          [ -n "$DYLIB_PATH" ] || { echo "❌ No .dylib found after make"; exit 1; }

          ldid -S "$DYLIB_PATH"
          echo "✅ $DYLIB_PATH ($(du -sh "$DYLIB_PATH" | cut -f1)) — arch: $(lipo -archs "$DYLIB_PATH")"

          cp "$DYLIB_PATH" "$RUNNER_TEMP/TwitchPlusK.dylib"
          echo "DYLIB_PATH=$RUNNER_TEMP/TwitchPlusK.dylib" >> "$GITHUB_ENV"

      - name: 📤 Save the .dylib
        uses: actions/upload-artifact@v7
        with:
          name: TwitchPlusK-v${{ github.run_number }}-dylib
          path: ${{ env.DYLIB_PATH }}
          retention-days: 7
          compression-level: 0

      - name: 🚀 Publish Dylib Release (fixed URL)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dylib-latest
          name: "Latest Dylib build (run #${{ github.run_number }})"
          files: ${{ env.DYLIB_PATH }}
          prerelease: true
          make_latest: false

      - name: ✅ Summary
        run: |
          {
            echo "### Dylib built 🎉"
            echo "Fixed URL (always latest):"
            echo "https://github.com/${{ github.repository }}/releases/download/dylib-latest/TwitchPlusK.dylib"
          } >> "$GITHUB_STEP_SUMMARY"
